# 앱 자동으로 만들기
# src/ · photos/ · icons/ · tools/ 를 고쳐서 저장(commit)하면, 깃허브가 알아서
#   1) 계산 점검(tools/check.js)  2) 앱 파일 만들기(tools/build.py)
# 를 하고, 새 index.html · sw.js · manifest.webmanifest 를 저장소 맨 위에 올려요.
# 그 뒤 1~2분이면 앱 주소에 반영돼요. 실패하면 저장소의 Actions 탭에서 빨간 X 를 눌러 이유를 볼 수 있어요.
name: 앱 만들기

on:
  push:
    branches: [main]
    paths: ['src/**', 'photos/**', 'icons/**', 'tools/**', '.github/workflows/build.yml']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 계산 점검
        run: node tools/check.js
      - name: 앱 파일 만들기
        run: python3 tools/build.py
      - name: 만든 파일 올리기
        run: |
          if git diff --quiet -- index.html sw.js manifest.webmanifest && [ -z "$(git ls-files --others --exclude-standard -- index.html sw.js manifest.webmanifest)" ]; then
            echo "바뀐 결과가 없어요."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js manifest.webmanifest
          git commit -m "앱 파일 자동으로 만들기 (${GITHUB_SHA::7})"
          git pull --rebase origin main
          git push origin HEAD:main
